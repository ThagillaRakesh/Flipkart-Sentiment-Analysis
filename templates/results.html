<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opinion Miner — Results</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background: #fff; }
    .back-link {
      display: inline-block;
      margin: 1rem 2rem;
      color: #1565c0;
      text-decoration: none;
      font-size: .95rem;
    }
    .back-link:hover { text-decoration: underline; }
    #results-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }
    .no-data {
      text-align: center;
      padding: 4rem 1rem;
      color: #888;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<a href="/" class="back-link">← Back to Opinion Miner</a>

<div id="results-container">
  <div class="no-data" id="no-data-msg">
    No results to display. <a href="/">Go back and run an analysis.</a>
  </div>
</div>

<script>
  // Results page: reads data stored in sessionStorage by main.js
  const raw = sessionStorage.getItem("lastResult");
  if (raw) {
    document.getElementById("no-data-msg").style.display = "none";
    const data = JSON.parse(raw);
    // Reuse the same rendering logic — include main.js just for the helpers
    // but call the renderer directly
    document.getElementById("results-container").innerHTML =
      "<p style='color:#888;font-size:.9rem'>Open the browser console for raw JSON data.</p>" +
      "<pre style='background:#f5f5f5;padding:1rem;border-radius:6px;overflow:auto;font-size:.8rem'>" +
      JSON.stringify(data, null, 2) + "</pre>";
  }
</script>

</body>
</html>
